name: Unit Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # The unit tests are hardware-free by design and run with CPU PyTorch.
      # Pin sglang to the version matching the target Kunlun runtime.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "torch==2.9.0" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "sglang" --no-deps
          python -m pip install "pytest==8.3.4"

      - name: Run unit tests
        run: pytest test